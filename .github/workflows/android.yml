name: Build Android APK
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
# Keep only the latest PR validation run active. This workflow builds Android, runs
# an emulator, and downloads large vision assets, so queued stale commits waste runners.
concurrency:
  group: brow-assistant-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK API 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Unable to locate Android SDK sdkmanager under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Download MediaPipe face model
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --output app/src/main/assets/face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task
          test -s app/src/main/assets/face_landmarker.task
      - name: Download compact EasyPortrait face parsing model
        run: |
          curl --fail --location --retry 3 --output app/src/main/assets/faceparsing.onnx https://huggingface.co/sadzip/EasyPortrait-ONNX/resolve/main/bisenet_fp.onnx
          test -s app/src/main/assets/faceparsing.onnx
          actual_size="$(stat -c%s app/src/main/assets/faceparsing.onnx)"
          echo "Downloaded faceparsing.onnx: ${actual_size} bytes"
          test "${actual_size}" -gt 10000000
          test "${actual_size}" -lt 20000000
      - name: Download public portrait for Android import regression test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/androidTest/assets
          curl --fail --location --retry 3 --output app/src/androidTest/assets/public_portrait.jpg 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1000&q=85'
          file app/src/androidTest/assets/public_portrait.jpg
          test -s app/src/androidTest/assets/public_portrait.jpg
      - name: Validate face parser model tensors and CPU inference
        run: |
          python -m pip install --quiet onnxruntime==1.23.2 numpy
          python - <<'PY'
          import numpy as np
          import onnxruntime as ort

          path = "app/src/main/assets/faceparsing.onnx"
          session = ort.InferenceSession(path, providers=["CPUExecutionProvider"])
          input_meta = session.get_inputs()[0]
          output_meta = session.get_outputs()[0]
          assert len(input_meta.shape) == 4 and input_meta.shape[1:] == [3, 384, 384], input_meta.shape
          assert input_meta.shape[0] in (1, "batch", None), input_meta.shape
          assert len(output_meta.shape) == 4, output_meta.shape
          sample = np.zeros((1, 3, 384, 384), dtype=np.float32)
          output = session.run([output_meta.name], {input_meta.name: sample})[0]
          assert output.shape == (1, 19, 384, 384), output.shape
          assert np.isfinite(output).all(), "Model produced NaN or infinite logits"
          print("EasyPortrait model OK:", input_meta.shape, "->", output.shape)
          PY
      - name: Build production-target ARM64 debug APK
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleDebug
          mkdir -p /tmp/face-pattern-oppo
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/face-pattern-oppo/app-debug.apk
      - name: Upload OPPO ARM64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-pattern-oppo-debug-apk
          path: /tmp/face-pattern-oppo/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Compile Android instrumentation tests without requiring an emulator
        run: gradle --no-daemon assembleDebugAndroidTest
      - name: Run case-library and mask-edit tests on an x86_64 Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -memory 4096 -cores 2
          disable-animations: true
          script: |
            set -eu
            adb devices
            adb wait-for-device
            adb shell getprop sys.boot_completed
            adb logcat -c
            set +e
            timeout 15m gradle --no-daemon clean connectedDebugAndroidTest -PemulatorSmoke=true
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "Android instrumentation tests failed or timed out (exit $status)"
              adb devices || true
              adb shell dumpsys activity activities || true
              adb logcat -d -s AndroidRuntime:E || true
              find app/build/outputs/androidTest-results app/build/reports/androidTests -maxdepth 5 -type f -print || true
              exit "$status"
            fi
            if ! adb shell pm grant com.example.facepattern android.permission.CAMERA; then
              adb logcat -d -s AndroidRuntime:E || true
              exit 1
            fi
            adb shell am start -W -n com.example.facepattern/.MainActivity
            sleep 8
            if ! adb shell pidof com.example.facepattern; then
              adb logcat -d -s AndroidRuntime:E || true
              echo "App process exited after launcher start"
              exit 1
            fi
            if adb logcat -d -s AndroidRuntime:E | grep -q "FATAL EXCEPTION"; then
              adb logcat -d -s AndroidRuntime:E
              echo "Android emulator reported a fatal app exception"
              exit 1
            fi
      - name: Upload Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 14

  python-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model tooling dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q ml
      - name: Test curvature statistics, ranker gates, and synthetic geometry
        run: python -m unittest discover -s ml/tests -v
      - name: Run synthetic preference probability calibration sandbox
        run: python ml/simulate_brow_ranker_sandbox.py --output /tmp/brow-ranker-sandbox-report.json
      - name: Run synthetic 3D surface compensation sandbox
        run: python ml/simulate_surface_compensation.py --output /tmp/surface-compensation-sandbox-report.json
      - name: Upload synthetic model and geometry reports
        uses: actions/upload-artifact@v4
        with:
          name: brow-sandbox-model-validation
          path: |
            /tmp/brow-ranker-sandbox-report.json
            /tmp/surface-compensation-sandbox-report.json
          if-no-files-found: error
          retention-days: 14

  public-image-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image smoke-test dependencies
        run: python -m pip install --quiet mediapipe==0.10.21 onnxruntime==1.23.2 pillow
      - name: Download the same vision assets used in the Android package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/brow-public-smoke/images /tmp/brow-public-smoke/output
          curl --fail --location --retry 3 --output /tmp/brow-public-smoke/face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task
          curl --fail --location --retry 3 --output /tmp/brow-public-smoke/faceparsing.onnx https://huggingface.co/sadzip/EasyPortrait-ONNX/resolve/main/bisenet_fp.onnx
      - name: Download public smoke-test portraits
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/brow-public-smoke/images/virtual_makeup_demo.png https://raw.githubusercontent.com/otdnnc/virtual-makeup/main/apps/web/public/f.png
          # Public portrait from Unsplash. It is downloaded at test time and is not committed to the repository.
          curl --fail --location --retry 3 --output /tmp/brow-public-smoke/images/unsplash_portrait.jpg 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1000&q=85'
          file /tmp/brow-public-smoke/images/*
      - name: Run MediaPipe and eyebrow-mask smoke test on public images
        run: |
          python ml/public_image_smoke_test.py \
            --face-model /tmp/brow-public-smoke/face_landmarker.task \
            --parser-model /tmp/brow-public-smoke/faceparsing.onnx \
            --images-dir /tmp/brow-public-smoke/images \
            --output-dir /tmp/brow-public-smoke/output
      - name: Upload public image smoke-test report and overlays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brow-public-image-smoke-results
          path: /tmp/brow-public-smoke/output/*
          if-no-files-found: warn
          retention-days: 14
